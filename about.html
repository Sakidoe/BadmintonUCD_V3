<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>About — BUCD</title>
    <meta name="description" content="[Page description]" />
    <meta name="theme-color" content="#022851" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body data-page="about">
    <div data-mount="nav"></div>

    <main>
      <!-- SECTION: PAGE HEADER -->
      <header class="page-hero">
        <div class="container">
          <span class="kicker">[Kicker]</span>
          <h1>[Page title]</h1>
          <p class="lede">
            [Medium Text Blurb]
          </p>
        </div>
      </header>

      <!-- SECTION: MISSION  (text from src/data/about.ts → mission) -->
      <section class="section section--paper">
        <div class="container--narrow" style="text-align: center" data-reveal>
          <span class="kicker" style="justify-content: center">[Kicker]</span>
          <h2 data-mission style="font-weight: 700; font-size: var(--text-2xl); line-height: 1.3; letter-spacing: -0.01em"></h2>
        </div>
      </section>

      <!-- SECTION: GOALS  (cards from src/data/about.ts → goals) -->
      <section class="section">
        <div class="container">
          <div class="section-head" data-reveal>
            <span class="kicker">[Kicker]</span>
            <h2>[Section heading]</h2>
          </div>
          <div class="cards" data-mount="goals" data-stagger="110"></div>
        </div>
      </section>

      <!-- SECTION: STORY -->
      <section class="section section--dark">
        <div class="container split split--flip">
          <div class="split__body" data-reveal="right">
            <span class="kicker">[Kicker]</span>
            <h2>[Section heading]</h2>
            <p class="lede mt-4">
              [Block]
            </p>
            <div class="btn-row mt-6">
              <a class="btn btn--gold" href="/events.html">[Button]</a>
            </div>
          </div>
          <div class="split__media split__media--teal" data-reveal="left">
            <img src="/img/boston-team.jpg" alt="[Photo description]" loading="lazy" />
          </div>
        </div>
      </section>

      <!-- SECTION: GALLERY  (photos from src/data/about.ts → gallery) -->
      <section class="section">
        <div class="container">
          <div class="section-head" data-reveal>
            <span class="kicker">[Kicker]</span>
            <h2>[Section heading]</h2>
          </div>
          <div class="gallery" data-mount="gallery" data-stagger="60"></div>
        </div>
      </section>

      <!-- SECTION: CTA -->
      <section class="section section--navy-deep cta-band">
        <div class="container" data-reveal>
          <h2>[Heading]</h2>
          <div class="btn-row">
            <a class="btn btn--gold btn--lg" href="/join.html">[Button]</a>
            <a class="btn btn--ghost btn--lg" href="/board.html">[Button]</a>
          </div>
        </div>
      </section>
    </main>

    <div data-mount="footer"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
